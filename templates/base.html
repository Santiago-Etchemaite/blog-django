{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Blog Django{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Blog Django</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="navbar-text">Hola, {{ user.username }}</span>
                {% else %}
                    <span class="navbar-text">No iniciaste sesión</span>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="container text-center text-muted py-4 mt-5 border-top">
        Blog hecho con Django por Santiago Etchemaite
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
