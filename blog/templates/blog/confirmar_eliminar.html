{% extends 'base.html' %}

{% block titulo %}Eliminar post | Blog Django{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h4 mb-3">Eliminar post</h1>
                <p>¿Seguro que querés eliminar <strong>"{{ post.titulo }}"</strong>? Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'detalle_post' post.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
